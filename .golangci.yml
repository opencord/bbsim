version: "2"

run:
  modules-download-mode: vendor
  tests: false

linters:
  enable:
    #- gochecknoglobals
    #- gochecknoinits
    #- gocritic
    #- gofmt
    #- golint
    - unparam

  settings:
    staticcheck:
      # Keep the SA* correctness checks. Disable the stylecheck (ST*),
      # quickfix (QF*) and a few gosimple (S*) checks that golangci-lint v2
      # folded into staticcheck but that were not part of the linter set
      # previously used by this repository. SA1019 (deprecations) is muted
      # here and tracked separately.
      checks:
        - all
        - -ST1003
        - -ST1005
        - -ST1008
        - -ST1016
        - -ST1023
        - -QF1003
        - -QF1007
        - -QF1008
        - -QF1010
        - -QF1011
        - -S1025
        - -S1038
        - -S1039
        - -SA1006
        - -SA1019

  exclusions:
    generated: lax
    # test helper files are only consumed by _test.go files, which are not
    # linted (run.tests: false); skip them to avoid false "unused" reports.
    paths:
      - _test_helpers\.go
    # Restore the default exclusion presets that golangci-lint v1 enabled
    # out of the box (errcheck on Close/print, legacy stylecheck comments, ...).
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # protobuf messages embed a sync.Mutex via MessageState; copying them by
      # value is standard practice with the generated code and safe here.
      - linters:
          - govet
        text: "copylocks:"
      # grpc status.Errorf and testing Fatalf are intentionally called with
      # dynamic (non-constant) format strings.
      - linters:
          - govet
        text: "non-constant format string"
      - linters:
          - govet
        text: "redundant newline"
      # unused/constant parameters in mocks and test helpers are expected.
      - linters:
          - unparam
        text: "(always receives|is unused|is always nil|is never used)"
