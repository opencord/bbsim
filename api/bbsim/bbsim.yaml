type: google.api.Service
config_version: 3

http:
  rules:
  - selector: bbsim.BBSim.Version
    get: "/v1/version"
  - selector: bbsim.BBSim.GetOlt
    get: "/v1/olt"
    additional_bindings:
      - get: "/v1/olt/status"
  - selector: bbsim.BBSim.GetONUs
    get: "/v1/olt/onus"
  - selector: bbsim.BBSim.GetONU
    get: "/v1/olt/onus/{SerialNumber}"

